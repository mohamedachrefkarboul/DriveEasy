server:
  port: 8083

spring:
  application:
    name: location-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

driveeasy:
  storage: in-memory-ram
  tarification:
    penalite-taux-journalier: 1.5
    remise-fidele-pourcent: 0.05
    remise-vip-pourcent: 0.10
